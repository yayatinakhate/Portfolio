<body>

<!-- Hero photo: WebGL depth-parallax canvas, or a plain image when WebGL is unavailable -->
<canvas id="gl" aria-hidden="true"></canvas>
<img id="hero-img" alt="" hidden aria-hidden="true">

<!-- Hero text overlay (filled from data/chapters.js) -->
<header id="hero"></header>
<div id="hero-space" aria-hidden="true"></div>

<!-- The drone's own feed: plays between waypoints, behind the HUD -->
<video id="transit" muted loop playsinline preload="none" poster="img/sun-1.jpg" aria-hidden="true"></video>

<!-- Goggles layers -->
<div id="feed" aria-hidden="true"></div>
<div id="hud" aria-label="Flight display"></div>

<!-- The journey: one <article class="chapter"> per entry in chapters[] -->
<main id="journey"></main>

<!-- Pull back out of the goggles -->
<section id="exit" aria-hidden="true"></section>

<footer id="finale" class="finale on-ink"></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" id="lbx">Close</button>
  <button class="nav prev" id="lbp" aria-label="Previous">‹</button>
  <figure><div class="lb-media" id="lbmedia"></div><figcaption id="lbcap"></figcaption><p class="lb-count" id="lbcount"></p></figure>
  <button class="nav next" id="lbn" aria-label="Next">›</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script src="js/hero-gl.js?v=1794729194"></script>
<script src="js/app.js?v=1794729194"></script>
<script src="js/fx.js?v=1794729194"></script>
</body>
</html>
